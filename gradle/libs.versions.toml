[versions]
kotlin = "2.2.21"
androidGradlePlugin = "8.13.1"
coreKtx = "1.17.0"
appCompat = "1.7.1"
constraintLayout = "2.2.1"
lifecycleRuntimeKtx = "2.10.0"
materialDesign = "1.13.0"
datastorePreferences = "1.2.0"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"
androidxArchCore = "2.2.0"
mockk = "1.14.6"
firebaseBom = "33.7.0"
okhttp = "5.3.2"
retrofit = "3.0.0"
gson = "2.13.2"
jsonPath = "2.10.0"
googleServices = "4.4.4"

[libraries]
# Kotlin
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Android Gradle Plugin
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appCompat" }
androidx-material = { module = "com.google.android.material:material", version.ref = "materialDesign" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-arch-core = { module = "androidx.arch.core:core-testing", version.ref = "androidxArchCore" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }

# Networking
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

# JSON Processing
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
json-path = { module = "com.jayway.jsonpath:json-path", version.ref = "jsonPath" }

# Google Services
google-services = { module = "com.google.gms:google-services", version.ref = "googleServices" }

[bundles]
androidx-core = ["androidx-core-ktx", "androidx-appcompat", "androidx-material"]
androidx-ui = ["androidx-constraintlayout", "androidx-lifecycle-runtime-ktx"]
testing = ["junit", "androidx-test-ext-junit", "androidx-test-espresso-core"]
networking = ["okhttp", "retrofit", "gson"]

