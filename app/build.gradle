import com.sslcf.AppConfig

plugins {
    alias(libs.plugins.androidApplication)
    alias(libs.plugins.kotlinAndroid)
    alias(libs.plugins.googleServices)
}


android {
    namespace = AppConfig.NAMESPACE
    compileSdk = AppConfig.COMPILE_SDK

    defaultConfig {
        applicationId = AppConfig.APPLICATION_ID
        minSdk = AppConfig.MIN_SDK
        targetSdk = AppConfig.TARGET_SDK
        versionCode = AppConfig.VERSION_CODE
        versionName = AppConfig.VERSION_NAME

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField('String', 'encryptedDataPart3', '""')
        buildConfigField('String', 'encryptedDataPart4', "\"${project.encryptedDataPart4}\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(AppConfig.JAVA_VERSION_INT)
        targetCompatibility = JavaVersion.toVersion(AppConfig.JAVA_VERSION_INT)
    }

    kotlinOptions {
        jvmTarget = AppConfig.JAVA_VERSION
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        disable 'PackagedPrivateKey'
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    ndkVersion = AppConfig.NDK_VERSION
}

dependencies {
    // AndroidX Core
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.material
    implementation libs.androidx.constraintlayout

    // Lifecycle
    implementation libs.androidx.lifecycle.runtime.ktx

    // Networking
    implementation libs.okhttp
    implementation libs.retrofit

    // Local module
    implementation project(':sslpinning')

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.database.ktx

    // JSON Processing
    implementation libs.gson

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
}